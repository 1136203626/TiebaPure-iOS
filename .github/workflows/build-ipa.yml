name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          ls /Applications | grep -i xcode || true
          if [ ! -d /Applications/Xcode_26.6.app ]; then
            echo "Xcode_26.6 not found, fallback to default"
            unset DEVELOPER_DIR
            sudo xcode-select -s /Applications/Xcode.app || true
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Release build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== BUILD FAILED, LAST 120 LINES ====="
            tail -120 build.log
            echo "===== ERROR LINES ====="
            grep -E "error:|❌|fatal" build.log | tail -40 || true
            exit "$status"
          fi

      - name: Package IPA
        run: |
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/TiebaPure.app"
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr TiebaPure-search-fix.ipa Payload
          ls -lh TiebaPure-search-fix.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TiebaPure-search-fix
          path: TiebaPure-search-fix.ipa
